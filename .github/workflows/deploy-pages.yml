name: Deploy Fox & Owl to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build Vite app
        working-directory: admin
        env:
          BASE_PATH: /fox-and-owl-tracker/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Fix public image paths for GitHub Pages
        working-directory: admin
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const root = path.join(process.cwd(), 'dist')
          const prefix = '/fox-and-owl-tracker'
          const folders = ['avatars', 'coins', 'lessons', 'payments', 'statistics', 'students', 'today']

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name)
              return entry.isDirectory() ? walk(full) : [full]
            })
          }

          for (const file of walk(root)) {
            if (!/\.(js|css|html)$/.test(file)) continue
            let text = fs.readFileSync(file, 'utf8')
            for (const folder of folders) {
              text = text.replaceAll(`/${folder}/`, `${prefix}/${folder}/`)
            }
            fs.writeFileSync(file, text)
          }
          NODE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: admin/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
